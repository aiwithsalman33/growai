# Production stack. Self-contained — do not layer with another compose file.
#
#   docker compose up -d --build
#
# Named docker-compose.yml because that is what deploy platforms (Dokploy,
# Coolify, Portainer) look for by default. `docker-compose.local.yml` is the
# development counterpart.
#
# The backend applies pending migrations on startup via
# backend/docker-entrypoint.sh, so a platform that only runs `compose up` still
# gets a schema. The `migrate` service below stays for running them by hand.
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    restart: always
    env_file: .env
    environment:
      # `environment` wins over `env_file`, which in turn overrides the image's
      # ENV. Without this line a .env carrying NODE_ENV=development would put
      # the production stack in development mode: the refresh cookie would lose
      # its Secure flag and the error handler would leak internal messages.
      NODE_ENV: production
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        # Baked into the bundle at build time. Keep it relative (/api) so the
        # same image works on any hostname.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: always
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      # Host port is configurable because a managed host usually already has
      # something on :80 (Traefik on Dokploy, for example). Set NGINX_PORT to a
      # free port there and point the platform's router at it; leave it unset
      # for a plain Docker host.
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-build
    env_file: .env
    environment:
      NODE_ENV: production
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    profiles: ["tools"] # on demand: docker compose run --rm migrate

volumes:
  postgres_data:
  uploads_data:

# Serves the built Vite SPA inside the `frontend-runtime` image.
# Not the reverse proxy — that is nginx/nginx.conf.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed Vite assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Routing lives in App.tsx's own path state, so any unknown path
  # must still return index.html rather than a 404.
  location / {
    try_files $uri /index.html;
  }
}

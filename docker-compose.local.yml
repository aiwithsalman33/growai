# Local development stack. Self-contained — do not layer with another compose file.
#   docker compose -f docker-compose.local.yml up --build
#
# node_modules is installed once at /app in the image and is deliberately NOT
# bind-mounted: only each workspace's own directory is mounted, so the shared,
# hoisted tree from the image stays intact.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # exposed in dev for a local DB GUI
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    env_file: .env
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      # Preserves any workspace-local node_modules from the image instead of
      # letting the bind mount hide it.
      - /app/backend/node_modules
      - uploads_data:/app/backend/uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    # -L polls for changes: inotify events do not cross a Windows/macOS bind
    # mount, so without it nodemon never reloads on edit.
    # The chown hands uploads_data to uid 1001, which the production image runs
    # as — a named volume keeps the ownership it was created with, so without
    # this a volume created here is unwritable in prod.
    command: >
      sh -c "mkdir -p /app/backend/uploads &&
      chown -R 1001:1001 /app/backend/uploads || true;
      exec npx nodemon -L src/server.js"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    env_file: .env
    working_dir: /app/frontend
    environment:
      # Inside the compose network the backend is reachable by service name.
      VITE_PROXY_TARGET: http://backend:4000
      VITE_POLL: "true"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  uploads_data:

# Local development stack. Self-contained — do not layer with another compose file.
#   docker compose -f docker-compose.local.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # exposed in dev for a local DB GUI
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    env_file: .env
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - uploads_data:/app/backend/uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    # -L polls for changes: inotify events do not cross a Windows/macOS
    # bind mount, so without it nodemon never reloads on edit.
    command: npx nodemon -L src/server.js

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    env_file: .env
    environment:
      # Inside the compose network the backend is reachable by service name.
      VITE_PROXY_TARGET: http://backend:4000
      VITE_POLL: "true"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  uploads_data:
